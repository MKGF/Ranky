name: AWS Create Infrastructure Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUCKET_NAME: ranky-s3

    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Create Secrets
        uses: 1arp/create-a-file-action@0.4.5
        with:
          path: 'src/main/resources/config'
          is AbsolutePath: false
          file: 'application-secret.properties'
          content: |
            riot.api.key=${{ secrets.RIOT_API_KEY }}
            disc.api.key=${{ secrets.DISCORD_API_KEY }}
            admin.ids=${{ secrets.DISCORD_ADMIN_IDS }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test with Maven
        run: mvn clean test

      - name: Build with Maven
        run: mvn clean package

      - name: Moving JAR to a visible directory for Terraform
        run: |
          mv ./target/Ranky.jar ./terraform/Ranky.jar
          mv ./target/classes/config ./terraform/config

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-3.amazonaws.com

      - name: Create S3 bucket for terraform.tfstate
        run: |
          BUCKET_NAME=ranky-s3
          FILE_PATH=terraform/terraform.tfstate
          aws s3api create-bucket --bucket $BUCKET_NAME --region eu-west-3 --create-bucket-configuration LocationConstraint=eu-west-3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}"
        working-directory: ./terraform

      - name: Upload file changes to S3 bucket
        if: always()
        run: |
          BUCKET_NAME=ranky-s3
          FILE_PATH=./terraform/terraform.tfstate
          aws s3 cp $FILE_PATH s3://$BUCKET_NAME/terraform.tfstate

      - name: Upload SSH Key .pem to S3 bucket
        run: |
          FILE_PATH=./terraform/ranky-ec2-ssh.pem
          aws s3 cp $FILE_PATH s3://$BUCKET_NAME/ranky-ec2-ssh.pem
      
      - name: Upload Ranky EC2 IP to S3 bucket
        run: |
          FILE_PATH=./terraform/ranky-ec2-ip.txt
          aws s3 cp $FILE_PATH s3://$BUCKET_NAME/ranky-ec2-ip.txt
      - name: Get repo's public key
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/MKGF/Ranky/actions/secrets/public-key)
            
          echo "KEY_ID=$(echo $RESPONSE | jq -r '.key_id')" >> $GITHUB_ENV
          echo "PUBLIC_KEY=$(echo $RESPONSE | jq -r '.key')" >> $GITHUB_ENV
      - name: Encrypt secrets
        run: |
          encrypt_secret() {
            echo -n "$1" | \
            openssl rsautl -encrypt -pubin -inkey <(echo "-----BEGIN PUBLIC KEY-----\n${{ env.PUBLIC_KEY }}\n-----END PUBLIC KEY-----") | \
            base64 -w0
          }

          echo "::add-mask::$(encrypt_secret '${{ secrets.LOCAL_PEM_KEY }}')"
          echo "::set-output name=encrypted_pem_key::$(encrypt_secret '${{ secrets.LOCAL_PEM_KEY }}')"

          echo "::add-mask::$(encrypt_secret '${{ secrets.LOCAL_IP_ADDRESS }}')"
          echo "::set-output name=encrypted_ip::$(encrypt_secret '${{ secrets.LOCAL_IP_ADDRESS }}')"

      - name: Update GitHub Secrets
        run: |
          curl -X PUT -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/MKGF/Ranky/actions/secrets/RANKY_EC2_PEM_KEY \
               -d "{\"encrypted_value\":\"${{ env.ENCRYPTED_KEY }}\", \"key_id\":\"${{ env.KEY_ID }}\"}"

          curl -X PUT -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/MKGF/Ranky/actions/secrets/RANKY_EC2_IP_ADDRESS \
               -d "{\"encrypted_value\":\"${{ env.ENCRYPTED_IP }}\", \"key_id\":\"${{ env.KEY_ID }}\"}"
